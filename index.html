/* 灵感归类下拉变更 */
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='importFile'){
    const f=e.target.files&&e.target.files[0];
    if(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!Array.isArray(d.courseLib))throw new Error('bad');db=d;if(!db.notes)db.notes=[];if(!db.feedDone)db.feedDone={};if(!db.evals)db.evals=[];if(!db.materials)db.materials=[];if(!db.school)db.school=[];if(!db.external)db.external=[];if(!db.trials)db.trials=[];if(!db.tasks)db.tasks=[];if(!db.ideas)db.ideas=[];if(!db.writings)db.writings=[];if(!db.sources)db.sources=[];if(!db.exemplars)db.exemplars=[];if(!db.fanwen)db.fanwen=[];if(!db.imits)db.imits=[];if(!db.trains)db.trains=[];if(!db.awards)db.awards=[];if(!db.publishes)db.publishes=[];if(!db.finals)db.finals=[];db.projects.forEach(ensureSteps);save();render();toast('备份已恢复：'+db.school.length+' 条在校、'+db.external.length+' 条外出、'+db.notes.length+' 条随手记');}catch(err){toast('备份文件无法识别，未做任何改动');}};r.readAsText(f);}
    e.target.value='';
  }
  /* 批量导入授课明细 */
  if(e.target&&e.target.id==='batchImportFile'){
    const f=e.target.files&&e.target.files[0];
    if(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw new Error('bad');
      const preview=document.getElementById('batchImportPreview');
      const newSchool=(d.school||[]).filter(x=>!db.school.some(y=>y.date===x.date&&y.course===x.course&&y.className===x.className));
      const newExt=(d.external||[]).filter(x=>!db.external.some(y=>y.date===x.date&&y.course===x.course&&y.org===x.org));
      const newEval=(d.evals||[]).filter(x=>!db.evals.some(y=>y.date===x.date&&y.teacher===x.teacher&&y.course===x.course));
      const newTrial=(d.trials||[]).filter(x=>!db.trials.some(y=>y.applyDate===x.applyDate&&y.course===x.course&&y.attempt===x.attempt));
      const newTask=(d.tasks||[]).filter(x=>!db.tasks.some(y=>y.kind===x.kind&&y.title===x.title&&y.date===x.date));
      const total=newSchool.length+newExt.length+newEval.length+newTrial.length+newTask.length;
      const dup=(d.school||[]).length+(d.external||[]).length+(d.evals||[]).length+(d.trials||[]).length+(d.tasks||[]).length-total;
      if(total===0){preview.style.display='block';preview.innerHTML=`<div class="tiny muted">文件中所有记录均已存在（共 ${dup} 条重复），无需导入。</div>`;return;}
      preview.style.display='block';
      preview.innerHTML=`<div style="font-weight:600;margin-bottom:8px">导入预览（共 ${total} 条新记录，跳过 ${dup} 条重复）</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-bottom:10px">
          ${newSchool.length?`<span class="chip">在校授课 ${newSchool.length} 条</span>`:''}
          ${newExt.length?`<span class="chip">外出授课 ${newExt.length} 条</span>`:''}
          ${newEval.length?`<span class="chip">听评课 ${newEval.length} 条</span>`:''}
          ${newTrial.length?`<span class="chip">试讲 ${newTrial.length} 条</span>`:''}
          ${newTask.length?`<span class="chip">微课/宣讲 ${newTask.length} 条</span>`:''}
        </div>
        <div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" id="confirmBatchImport">确认导入</button><button class="btn btn-ghost btn-sm" id="cancelBatchImport">取消</button></div>`;
      document.getElementById('confirmBatchImport').onclick=()=>{
        newSchool.forEach(x=>db.school.push({...x,id:uid()}));
        newExt.forEach(x=>db.external.push({...x,id:uid()}));
        newEval.forEach(x=>db.evals.push({...x,id:uid()}));
        newTrial.forEach(x=>db.trials.push({...x,id:uid()}));
        newTask.forEach(x=>db.tasks.push({...x,id:uid()}));
        save();render();toast('已导入 '+total+' 条记录（跳过 '+dup+' 条重复）');
      };
      document.getElementById('cancelBatchImport').onclick=()=>{preview.style.display='none';preview.innerHTML='';};
    }catch(err){toast('导入文件无法识别，未做任何改动');}};r.readAsText(f);}
    e.target.value='';
  }
  if(e.target.classList.contains('cat-sel')){
    const i=db.ideas.find(x=>x.id===e.target.getAttribute('data-id'));
    if(i){i.cat=e.target.value;save();toast('已归入「'+e.target.value+'」');}
  }
  /* 课程下拉：选择「其他课程」时显示自由填写框 */
  if(e.target.classList.contains('course-sel'))courseSelChange(e.target);
  /* 在校授课 · 授课费实时计算 */
  const feeForm=e.target.closest('form[data-form="school"]');
  if(feeForm){
    const venue=feeForm.querySelector('[name="venue"]').value;
    const level=feeForm.querySelector('[name="level"]').value;
    const first=feeForm.querySelector('[name="firstSenior"]').checked;
    const pv=feeForm.querySelector('#feePreview');
    if(pv)pv.textContent='¥'+schoolFee(venue,level,first);
    if(venue==='sr'){const lv=feeForm.querySelector('[name="level"]');lv.disabled=true;}
    else{const lv=feeForm.querySelector('[name="level"]');lv.disabled=false;}
  }
  /* 外出授课 · 课时费档位与场次实时计算（6 档：1课时200 / 1.5课时400 / 2课时400 / 1课时160 / 1.5课时320 / 2课时320） */
  const extForm=e.target.closest('form[data-form="external"]');
  if(extForm){
    const s=Number(extForm.querySelector('[name="sessions"]').value)||1;
    const plan=extForm.querySelector('[name="feePlan"]')?.value||'2-400';
    const pv=extForm.querySelector('#extFeePreview');
    if(pv)pv.textContent='¥'+s*extUnitFee(plan);
    const hb=extForm.querySelector('[name="hours"]');
    if(hb&&!hb.dataset.touched)hb.value=extPlanHours(plan,2);
  }
  /* 试讲 · 分类 / 次数 / 通过状态实时计算 */
  const trialEl=e.target.closest('form[data-form="trial"]');
  if(trialEl){
    const type=trialEl.querySelector('[name="type"]').value;
    const attempt=Number(trialEl.querySelector('[name="attempt"]').value)||1;
    const passed=trialEl.querySelector('[name="passed"]').value==='1';
    const org=trialEl.querySelector('[name="withOrg"]')?.checked||false;
    const t=TRIAL_TYPES.find(z=>z.v===type)||TRIAL_TYPES[2];
    const am=trialEl.querySelector('[name="attempt"]');
    if(am){am.max=t.rounds;if(attempt>t.rounds)am.value=t.rounds;}
    const orgBox=trialEl.querySelector('#trialOrgBox');
    if(orgBox)orgBox.style.display=(type==='mooc'&&attempt>=2)?'':'none';
    const tip=trialEl.querySelector('#trialRuleTip');
    if(tip)tip.textContent=t.desc+(type==='mooc'?'（与机关联合试讲另 +200）':'')+'；未通过不计费。';
    const pv=trialEl.querySelector('#trialFeePreview');
    if(pv)pv.textContent='¥'+trialFee(type,attempt,passed,org);
  }
  /* 工作安排 · 类型 / 场次 */
  const taskFormEl=e.target.closest('form[data-form="task"]');
  if(taskFormEl){
    const kind=taskFormEl.querySelector('[name="kind"]').value;
    const ext=taskFormEl.querySelector('#taskExtFields');
    const pf=taskFormEl.querySelector('#taskPreachFields');
    const s=Number(taskFormEl.querySelector('[name="sessions"]')?.value)||1;
    if(ext)ext.style.display=kind==='preach'?'':'none';
    if(pf)pf.style.display=kind==='preach'?'':'none';
    const pv=taskFormEl.querySelector('#taskFeePreview');
    if(pv)pv.textContent=kind==='micro'?'¥300':'¥'+s*200;
  }
  /* 学时手动填写后不再被档位覆盖 */
  if(e.target.matches('form[data-form="external"] [name="hours"]')){
    e.target.dataset.touched='1';
  }
});
document.addEventListener('click',e=>{
  const feeForm=e.target.closest('form[data-form="school"]');
  if(feeForm&&e.target.matches('[name="firstSenior"]')){
    const venue=feeForm.querySelector('[name="venue"]').value;
    const level=feeForm.querySelector('[name="level"]').value;
    const first=feeForm.querySelector('[name="firstSenior"]').checked;
    const pv=feeForm.querySelector('#feePreview');
    if(pv)pv.textContent='¥'+schoolFee(venue,level,first);
  }
});

/* 检索实时 */
let searchTimer=null;
document.addEventListener('input',e=>{
  if(e.target.id==='searchInput'){
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      const q=e.target.value.trim();
      if(q)go('search?q='+encodeURIComponent(q));
      else go('search');
    },350);
  }
});

/* 菜单开合 */
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('app').classList.add('rail-open'));
document.getElementById('scrim').addEventListener('click',()=>document.getElementById('app').classList.remove('rail-open'));
document.addEventListener('click',e=>{
  const app=document.getElementById('app');
  if(app.classList.contains('rail-open')&&e.target.closest('.nav-item'))app.classList.remove('rail-open');
});

render();
if(restoredFrom){save();setTimeout(()=>toast('检测到主数据为空，已自动从「'+restoredFrom+'」恢复你的记录，数据安全无虞'),900);}
autoExportIfNeeded();
</script>
</body>
</html>
