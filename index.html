<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>杜小杜的知识工作台</title>
<meta name="description" content="杜小杜的知识工作台 —— 数字化私人书房与编辑工作室">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   杜小杜的知识工作台 · 设计令牌
   主题：编辑书房的文学出版感 —— 深墨绿书橱 / 米白纸面 / 灰棕墨色 / 酒红印章
   ============================================================ */
:root{
  --paper:#F4EFE3;      /* 米白纸底 */
  --ivory:#FBF7EE;      /* 象牙白卡片 */
  --card:#FFFDF7;       /* 亮纸面 */
  --ink:#26342C;        /* 正文墨色 */
  --green:#23483C;      /* 深墨绿 */
  --green-2:#2F5D4D;    /* 次级墨绿 */
  --moss:#6E8B78;       /* 苔绿 · 辅助 */
  --sage:#C9D6C8;       /* 淡青绿 */
  --brown:#6C6155;      /* 灰棕正文次要 */
  --taupe:#A99B87;      /* 浅灰棕 */
  --line:#E4DBC8;       /* 发丝线 */
  --line-2:#D3C7AE;     /* 深一线 */
  --wine:#8C3A45;       /* 酒红强调 */
  --wine-2:#6E2B34;     /* 深酒红 */
  --rail:#1E3B31;       /* 书橱底 */
  --rail-2:#172E26;
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --shadow:0 1px 2px rgba(31,55,45,.06),0 6px 18px -12px rgba(31,55,45,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sage);color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:inherit;text-decoration:none}

/* ============ 图标 ============ */
.ic{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.28em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:1em;height:1em;vertical-align:-.2em}
.ic-lg{width:1.5em;height:1.5em}

/* ============ 应用骨架 ============ */
#app{display:flex;min-height:100vh}
#scrim{display:none}

/* ============ 书橱侧栏 ============ */
#rail{
  width:236px;flex:none;background:linear-gradient(165deg,var(--rail) 0%,var(--rail-2) 100%);
  color:var(--ivory);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid rgba(255,255,255,.05);
}
.brand{padding:26px 18px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand-top{display:flex;align-items:center;gap:12px}
.seal{
  width:40px;height:40px;background:var(--wine);color:var(--ivory);
  font-family:var(--serif);font-weight:700;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  border-radius:5px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 2px 6px rgba(0,0,0,.3);
  letter-spacing:0;
}
.brand-name{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.35;letter-spacing:.04em}
.brand-sub{font-size:10.5px;color:var(--sage);letter-spacing:.18em;margin-top:5px}
.rail-foot{padding:16px 18px;margin-top:auto;font-size:10.5px;color:var(--sage);opacity:.75;line-height:1.7;border-top:1px solid rgba(255,255,255,.07)}

/* 书脊导航 */
#nav{padding:10px 12px 16px}
.nav-group{margin-top:16px}
.nav-group:first-child{margin-top:6px}
.nav-kicker{font-size:10px;letter-spacing:.32em;color:var(--sage);opacity:.65;padding:0 10px 7px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:3px 0;border-radius:7px;
  color:var(--ivory);font-size:13.5px;letter-spacing:.05em;
  background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border-left:3px solid transparent;
  transition:background .18s,transform .18s,border-color .18s;
  position:relative;
}
.nav-item .ic{opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.10)}
.nav-item.active{
  background:var(--ivory);color:var(--green);font-weight:600;
  border-left-color:var(--wine);
  box-shadow:0 2px 10px -4px rgba(0,0,0,.4);
}
.nav-item.active .ic{opacity:1}
.nav-count{margin-left:auto;font-size:11px;color:var(--sage);background:rgba(255,255,255,.10);border-radius:20px;padding:1px 8px}
.nav-item.active .nav-count{color:var(--wine);background:rgba(140,58,69,.10)}
.nav-item .seal-dot{display:none}
.nav-item.active .seal-dot{display:block;width:8px;height:8px;background:var(--wine);border-radius:2px;position:absolute;right:10px;bottom:7px}

/* ============ 主区 ============ */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(244,239,227,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:16px 30px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
}
.topbar-left{display:flex;align-items:baseline;gap:14px;min-width:0}
.kicker{font-size:11px;letter-spacing:.26em;color:var(--wine);font-weight:500;white-space:nowrap}
.page-title{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.06em;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:10px;flex:none}
.date-chip{font-size:12px;color:var(--brown);border:1px solid var(--line-2);padding:6px 12px;border-radius:6px;background:var(--ivory);letter-spacing:.04em;white-space:nowrap}

.content{padding:24px 30px 60px;max-width:1240px;width:100%}

/* ============ 通用组件 ============ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:6px;font-size:13px;letter-spacing:.05em;
  border:1px solid transparent;transition:all .15s;white-space:nowrap;
}
.btn-primary{background:var(--wine);color:var(--ivory)}
.btn-primary:hover{background:var(--wine-2)}
.btn-ghost{background:transparent;color:var(--green);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--green);background:rgba(35,72,60,.05)}
.btn-soft{background:var(--sage);color:var(--green)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-danger{color:var(--wine)}
.btn-danger:hover{background:rgba(140,58,69,.08)}
.btn-icon{padding:7px;border-radius:6px;color:var(--brown)}
.btn-icon:hover{background:rgba(35,72,60,.08);color:var(--green)}
.btn.block{width:100%;justify-content:center}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow);padding:20px 22px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.card-title .tick{width:4px;height:16px;background:var(--wine);border-radius:2px;flex:none}

.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.section-gap{margin-top:26px}
.muted{color:var(--brown)}
.tiny{font-size:12px}
.hr{border:none;border-top:1px solid var(--line);margin:16px 0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2.5px 9px;border-radius:20px;border:1px solid var(--line-2);color:var(--brown);background:var(--ivory);white-space:nowrap}
.chip.wine{color:var(--wine);border-color:rgba(140,58,69,.35)}
.chip.green{color:var(--green-2);border-color:rgba(47,93,77,.35)}
.chip.moss{color:var(--moss);border-color:rgba(110,139,120,.4)}

.empty{
  text-align:center;padding:40px 20px;color:var(--taupe);
  font-family:var(--serif);font-size:14px;letter-spacing:.08em;line-height:2;
}
.empty .seal-line{width:34px;height:34px;border:1.5px solid var(--line-2);border-radius:4px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--taupe);font-size:14px}

/* 存储不可用提示 */
.warn-banner{margin:0 0 16px;padding:12px 16px;border:1px solid rgba(140,58,69,.35);border-left:4px solid var(--wine);background:rgba(140,58,69,.06);color:var(--wine);font-size:13px;line-height:1.8;border-radius:6px}

/* 随手记快速输入 */
.note-capture{display:flex;gap:10px;align-items:stretch}
.note-capture input{flex:1}
.note-preview{margin-top:8px;font-size:12px;color:var(--taupe)}
.note-preview b{color:var(--moss);font-weight:600}

/* 列表条目 */
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:500}
.row-sub{font-size:12px;color:var(--brown);margin-top:2px}

/* 进度 */
.progress{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--moss));border-radius:4px;transition:width .3s}
.progress.wine>i{background:linear-gradient(90deg,var(--wine-2),var(--wine))}

/* 状态标记 */
.status{font-size:11px;display:inline-flex;align-items:center;gap:5px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--moss)}
.status.active::before{background:var(--green-2)}
.status.done::before{background:var(--wine);border-radius:1.5px}
.status.overdue::before{background:var(--wine)}

/* ============ 今日首页 ============ */
.hero{
  background:linear-gradient(135deg,var(--green) 0%,var(--green-2) 100%);
  color:var(--ivory);border-radius:10px;padding:26px 28px;margin-bottom:20px;
  position:relative;overflow:hidden;
}
.hero::after{content:"印";position:absolute;right:22px;bottom:-24px;font-family:var(--serif);font-size:130px;color:rgba(255,255,255,.05);font-weight:900}
.hero-date{font-family:var(--serif);font-size:20px;letter-spacing:.1em;font-weight:600}
.hero-greet{font-size:13px;color:var(--sage);margin-top:6px;letter-spacing:.04em}
.hero-stats{display:flex;gap:34px;margin-top:18px;flex-wrap:wrap}
.hero-stat .n{font-family:var(--serif);font-size:26px;font-weight:900;letter-spacing:.03em}
.hero-stat .l{font-size:11.5px;color:var(--sage);margin-top:2px;letter-spacing:.12em}

.quick-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.quick-row .btn{background:var(--ivory);border:1px solid var(--line-2);color:var(--green);box-shadow:var(--shadow)}
.quick-row .btn:hover{border-color:var(--green)}

/* 待办勾选 */
.check{
  width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;color:transparent;transition:all .15s;
}
.check.on{background:var(--green);border-color:var(--green);color:var(--ivory)}
.step-row{cursor:pointer}
.step-row:hover .check{border-color:var(--green)}
.done-text{text-decoration:line-through;color:var(--taupe)}

/* ============ 上课日历 ============ */
.cal{width:100%;border-collapse:collapse}
.cal th{font-size:11px;color:var(--brown);font-weight:500;padding:6px 0;letter-spacing:.15em}
.cal td{text-align:center;padding:3px;height:auto;min-height:88px;width:14.28%;position:relative;vertical-align:top}
.cal .dnum{width:30px;height:30px;line-height:30px;border-radius:7px;font-size:12.5px;margin:0 auto;cursor:pointer}
.cal .dnum:hover{background:var(--sage)}
.cal .dnum.today{background:var(--green);color:var(--ivory);font-weight:700}
.cal .dnum.has{font-weight:700;color:var(--green-2);border:1px solid var(--green-2)}
.cal .dnum.blank{color:var(--taupe)}
.cal .dots{display:flex;justify-content:center;gap:2px;position:absolute;bottom:2px;left:0;right:0}
.cal .dots i{width:4px;height:4px;border-radius:50%;background:var(--wine)}
.cal-slots{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.cal-slot{height:14px;border-radius:3px;font-size:9px;line-height:14px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:default}
.cal-slot.empty{background:rgba(120,105,85,.07)}
.cal-slot.green{background:rgba(44,116,92,.92);color:#fff}
.cal-slot.yellow{background:rgba(206,172,86,.95);color:#3a3226}
.cal-slot.red{background:rgba(176,58,46,.9);color:#fff}
.cal-tags{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.cal-tag{font-size:9px;line-height:13px;padding:0 4px;border:1px solid var(--line-2);border-radius:3px;color:var(--brown);background:rgba(255,255,255,.4)}

/* ============ 时间线 ============ */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1.5px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 18px 6px}
.tl-item::before{content:"";position:absolute;left:-26px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2.5px solid var(--green-2)}
.tl-item.t-done::before{background:var(--wine);border-color:var(--wine)}
.tl-item.t-course::before{border-color:var(--wine);background:var(--wine)}
.tl-item.t-deadline::before{border-color:var(--taupe)}
.tl-date{font-size:11px;color:var(--taupe);letter-spacing:.12em}
.tl-title{font-size:13.5px;margin-top:2px}
.tl-month{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.1em;margin:18px 0 12px;color:var(--green);display:flex;align-items:center;gap:10px}
.tl-month::after{content:"";flex:1;height:1px;background:var(--line)}

/* ============ 检索 ============ */
.searchbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:12px 16px;box-shadow:var(--shadow)}
.searchbox input{flex:1;border:none;outline:none;background:transparent;font-size:15px}
.searchbox:focus-within{border-color:var(--green)}
.search-hit{padding:12px 2px;border-bottom:1px solid var(--line)}
.search-hit .hit-title{font-size:14px;font-weight:500}
.search-hit .hit-body{font-size:12.5px;color:var(--brown);margin-top:3px}

/* ============ 表单弹窗 ============ */
#modal{
  position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;
  background:rgba(23,46,38,.45);backdrop-filter:blur(3px);padding:40px 16px;overflow-y:auto;
}
#modal.hidden{display:none}
.modal-panel{
  background:var(--ivory);border-radius:10px;width:100%;max-width:560px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.4);border:1px solid var(--line);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal-title{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.05em}
.modal-body{padding:20px 24px 24px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12px;color:var(--brown);letter-spacing:.1em;margin-bottom:6px}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld input[type=number],.fld select,.fld textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--card);outline:none;transition:border .15s;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--green-2)}
.fld textarea{resize:vertical;min-height:76px;line-height:1.6}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.suggest-field{border:1px dashed var(--line-2);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:rgba(35,72,60,.02)}
.suggest-field .num{font-family:var(--serif);color:var(--wine);font-size:13px;margin-right:6px}

/* ============ 提示 toast ============ */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--green);color:var(--ivory);padding:11px 22px;border-radius:8px;
  font-size:13px;letter-spacing:.05em;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 上课 · 统计卡 / 表格 / 分段 ============ */
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:14px 16px;box-shadow:var(--shadow)}
.stat-card .n{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.02em;color:var(--green)}
.stat-card .l{font-size:11px;color:var(--brown);letter-spacing:.14em;margin-top:2px}
.seg{display:inline-flex;background:var(--ivory);border:1px solid var(--line-2);border-radius:8px;padding:3px;gap:2px}
.seg-btn{padding:7px 16px;border-radius:6px;font-size:13px;color:var(--brown);letter-spacing:.06em;transition:all .15s}
.seg-btn.on{background:var(--green);color:var(--ivory);font-weight:600}
.table-wrap{overflow-x:auto;margin-top:4px}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
.data-table th{text-align:left;font-size:11px;color:var(--brown);letter-spacing:.12em;font-weight:500;padding:9px 10px;border-bottom:1.5px solid var(--line-2);white-space:nowrap;background:var(--ivory)}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(35,72,60,.03)}
.data-table .num{font-family:var(--serif);font-weight:700}
.done-row td{opacity:.55}
.done-row td .row-title{text-decoration:line-through}
.course-lib-chip{display:flex;gap:10px}

/* ============ 移动端 ============ */
#menuBtn{display:none}
@media (max-width:980px){
  #rail{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .25s ease;height:100vh;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #app.rail-open #rail{transform:translateX(0)}
  #app.rail-open #scrim{display:block;position:fixed;inset:0;background:rgba(23,46,38,.4);z-index:50}
  #menuBtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid var(--line-2);background:var(--ivory);color:var(--green)}
  .content{padding:18px 16px 60px}
  .topbar{padding:12px 16px;flex-wrap:wrap}
  .page-title{font-size:20px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .hero{padding:20px}
  .hero-stats{gap:22px}
}
@media (max-width:640px){
  .fld-row{grid-template-columns:1fr}
  .topbar-right .date-chip{display:none}
}
</style>
</head>
<body>
<div id="app">
  <!-- ===== 书橱侧栏 ===== -->
  <aside id="rail">
    <div class="brand">
      <div class="brand-top">
        <div class="seal">杜</div>
        <div>
          <div class="brand-name">杜小杜的<br>知识工作台</div>
          <div class="brand-sub">私人书房 · 编辑工作室</div>
        </div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">案头数据存于本机浏览器<br>随开随用 · 离线可读 · 实时保存</div>
  </aside>
  <div id="scrim"></div>

  <!-- ===== 主区 ===== -->
  <main id="main">
    <div class="topbar">
      <button id="menuBtn" title="打开书橱" aria-label="打开书橱"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="topbar-left">
        <span class="kicker" id="tbKicker">今日</span>
        <h2 class="page-title" id="tbTitle">案头</h2>
      </div>

/* 随手记 · 日期识别（今天/明天/后天/本周X/下周X/X月X日/YYYY-MM-DD） */
function parseNoteDate(text){
  const now=new Date();
  let m=text.match(/(20\d{2})[年\-\.\/](\d{1,2})[月\-\.\/](\d{1,2})日?/);
  if(m)return toISO(new Date(+m[1],+m[2]-1,+m[3]));
  m=text.match(/(\d{1,2})月(\d{1,2})[日号]/);
  if(m)return toISO(new Date(now.getFullYear(),+m[1]-1,+m[2]));
  const wdMap={一:1,二:2,三:3,四:4,五:5,六:6,日:0,天:0};
  m=text.match(/(本|下|上)?周([一二三四五六日天])/);
  if(m){
    const target=wdMap[m[2]];
    const cur=(now.getDay()+6)%7; // 0=周一
    let off=(target+6)%7 - cur;
    if(m[1]==='下')off+=7;
    else if(m[1]==='上')off-=7;
    else if(off<0)off+=7;
    return toISO(new Date(now.getFullYear(),now.getMonth(),now.getDate()+off));
  }
  if(text.includes('大后天'))return addDays(todayISO(),3);
  if(text.includes('后天'))return addDays(todayISO(),2);
  if(text.includes('明天'))return addDays(todayISO(),1);
  if(text.includes('今天')||text.includes('今日'))return todayISO();
  return '';
}
/* 随手记 · 时间识别（HH:MM / X点 / 上午/下午/晚上） */
function parseNoteTime(text){
  let m=text.match(/(\d{1,2}):(\d{2})/);
  if(m)return m[1].padStart(2,'0')+':'+m[2];
  m=text.match(/(\d{1,2})[点时](\d{1,2})?分?/);
  if(m){
    let h=+m[1];
    if((text.includes('下午')||text.includes('晚上')||text.includes('晚间'))&&h<12)h+=12;
    return String(h).padStart(2,'0')+':'+String(m[2]||0).padStart(2,'0');
  }
  if(text.includes('上午')||text.includes('早上'))return '09:00';
  if(text.includes('中午'))return '12:00';
  if(text.includes('下午'))return '14:00';
  if(text.includes('晚上')||text.includes('晚间'))return '19:00';
  return '';
}
/* 时间加小时（HH:MM + N小时） */
function addHours(hm,h){
  if(!hm)return '';
  const [h1,m1]=hm.split(':').map(Number);
  const total=h1*60+m1+h*60;
  const nh=Math.floor(total/60)%24;
  const nm=total%60;
  return String(nh).padStart(2,'0')+':'+String(nm).padStart(2,'0');
}

/* 按日期确定性轮换：每天 10 条，来源尽量互不相同、条目逐日变化 */
function dailyFeed(){
  const dayNum=Math.floor(Date.now()/86400000);
  const groups={};
  DAILY_FEED.forEach((f,i)=>{if(!groups[f.src])groups[f.src]=[];groups[f.src].push({url:f.url,src:f.src,title:f.title,kind:f.kind});});
  const srcs=Object.keys(groups); // 保持池内首次出现顺序
  const rot=dayNum%srcs.length;
  const ordered=srcs.slice(rot).concat(srcs.slice(0,rot));
  const picks=[];let gi=0;
  while(picks.length<Math.min(10,DAILY_FEED.length)&&gi<400){
    const src=ordered[gi%ordered.length];
    const arr=groups[src];
    const it=arr[(Math.floor(gi/ordered.length)+dayNum)%arr.length];
    if(!picks.some(p=>p.url===it.url))picks.push(it);
    gi++;
  }
  return picks;
}

const DEFAULT_GITEE={token:'5c65e6fb91734d78c28c2c90c843f135',owner:'duxiaodu-workbench',repo:'du-xiaodus-warehouse',enabled:true};
let _cloudReady=false; /* 初始云端拉取完成前，禁止推送（防止种子数据覆盖好数据） */
function giteeCfg(){try{const saved=JSON.parse(lsGet(KEY_GITEE)||'{}')||{};return Object.assign({},DEFAULT_GITEE,saved);}catch(e){return Object.assign({},DEFAULT_GITEE);}}
/* 从云端拉取最新数据（打开页面时立即调用，拉取完成前禁止推送） */
function giteePull(cb){
  const cfg=giteeCfg();
  if(!cfg.enabled||!cfg.token||!cfg.owner||!cfg.repo){_cloudReady=true;cb&&cb({ok:false,msg:'未配置云端'});return;}
  const path='backup/duxiaodu-workbench-data.json';
  const api='https://gitee.com/api/v5/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+path;
  fetch(api+'?access_token='+encodeURIComponent(cfg.token)).then(r=>{
    if(r.status===404){_cloudReady=true;cb&&cb({ok:false,msg:'云端暂无备份'});return null;}
    return r.json();
  }).then(j=>{
    _cloudReady=true;
    if(!j||!j.content){cb&&cb({ok:false,msg:'云端数据为空'});return;}
    try{
      const raw=decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))));
      const cloudData=JSON.parse(raw);
      const localCount=countRecords(db);
      const cloudCount=countRecords(cloudData);
      const cloudNewer=cloudData._savedAt&&(!db._savedAt||cloudData._savedAt>db._savedAt);
      const localEmpty=localCount===0||(localCount<=5&&cloudCount>20); /* 本地几乎为空时强制从云端恢复 */
      if(cloudCount>localCount||cloudNewer||localEmpty){
        Object.assign(db,cloudData);
        if(!db.exemplars)db.exemplars=[];
        if(!db.evals)db.evals=[];
        if(!db.courseLib)db.courseLib=[];
        lsSet(KEY_MAIN,JSON.stringify(db));
        lsSet(KEY_SHADOW,JSON.stringify(db));
        cb&&cb({ok:true,msg:'已从云端恢复 '+cloudCount+' 条记录',restored:true});
      }else{
        cb&&cb({ok:true,msg:'本地数据已是最新',restored:false});
      }
    }catch(e){cb&&cb({ok:false,msg:'云端数据解析失败：'+String(e)});}
  }).catch(e=>{_cloudReady=true;cb&&cb({ok:false,msg:'云端拉取失败：'+String(e.message||e)});});
}
function cloudSyncNow(cb){
  const cfg=giteeCfg();
  if(!cfg.enabled||!cfg.token||!cfg.owner||!cfg.repo){db._giteeLastError='未配置令牌或未启用';cb&&cb({ok:false,msg:'未配置 Gitee 云端（需填写令牌并勾选启用）'});return;}
  const path='backup/duxiaodu-workbench-data.json';
  let payload;
  try{payload=btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2))));}catch(e){db._giteeLastError='数据编码失败';cb&&cb({ok:false,msg:'备份数据编码失败：'+String(e)});return;}
  const api='https://gitee.com/api/v5/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+path;
  const msg='工作台自动备份 '+todayISO()+' '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
  // 取文件 sha（私有仓库需令牌）
  const getSha=()=>fetch(api+'?access_token='+encodeURIComponent(cfg.token)).then(r=>r.json().then(j=>({status:r.status,body:j}))).then(({status,body})=>{
    if(status===404&&body&&body.message&&String(body.message).includes('Project'))throw new Error('令牌无权访问该仓库（请确认勾选了 projects 权限、属主/仓库名正确）');
    return (body&&body.sha)||'';
  });
  // 写入：有 sha 则 PUT 更新，无则 POST 新建；遇「已存在」自动取 sha 重试一次
  const write=(sha)=>{
    const body={access_token:cfg.token,content:payload,message:msg};
    if(sha)body.sha=sha;
    return fetch(api,{method:sha?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()).then(res=>{
      if(res&&(res.content||res.sha))return {ok:true};
      const m=(res&&res.message)||'';
      if(/already|已存在|存在/.test(m)&&!sha){return getSha().then(s=>s?write(s):{ok:false,msg:m});}
      return {ok:false,msg:m||'未知原因'};
    });
  };
  getSha().then(sha=>write(sha)).then(r=>{
    if(r.ok){db._giteeSyncAt=Date.now();db._giteeLastError='';lsSet(KEY_MAIN,JSON.stringify(db));cb&&cb({ok:true,msg:'已同步到 Gitee 云端 · '+todayISO()+' '+new Date().toLocaleTimeString('zh-CN',{hour12:false})});}
    else{db._giteeLastError=r.msg;cb&&cb({ok:false,msg:'同步未完成：'+r.msg});}
  }).catch(e=>{db._giteeLastError=String(e.message||e);cb&&cb({ok:false,msg:'云端同步失败：'+String(e.message||e)});});
}
/* 测试令牌是否能访问仓库（不写入数据） */
function testGiteeConnection(cb){
  const cfg=giteeCfg();
  if(!cfg.token||!cfg.owner||!cfg.repo){cb&&cb({ok:false,msg:'请先填写令牌、仓库属主和仓库名'});return;}
  const api='https://gitee.com/api/v5/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo);
  fetch(api+'?access_token='+encodeURIComponent(cfg.token)).then(r=>r.json().then(j=>({status:r.status,body:j}))).then(({status,body})=>{
    if(status===200&&body&&body.full_name){cb&&cb({ok:true,msg:'连接成功 · 仓库 '+body.full_name+'（'+(body.private?'私有':'公开')+'）'});}
    else if(status===401){cb&&cb({ok:false,msg:'令牌无效或已过期，请重新生成'});}
    else if(status===404){cb&&cb({ok:false,msg:'找不到该仓库（令牌无权访问，或属主/仓库名填错）'});}
    else{cb&&cb({ok:false,msg:'连接异常：'+(body&&body.message?body.message:('HTTP '+status))});}
  }).catch(e=>cb&&cb({ok:false,msg:'网络请求失败：'+String(e.message||e)}));
}
let _cloudTimer=null;
function cloudSyncQueued(){
  const cfg=giteeCfg();
  if(!cfg.enabled||!cfg.token)return;
  if(!_cloudReady)return; /* 初始拉取未完成，禁止推送（防止种子数据覆盖） */

}

/* 项目步骤补齐（自动拆进度） */
function ensureSteps(p){
  if(p.steps&&p.steps.length)return;
  const sub=(SUBTYPES[p.module]||[]).find(s=>s.k===p.sub);
  const tpl=sub?sub.tpl:[];
  if(!tpl.length)return;
  const start=p.created||todayISO();
  const end=p.deadline||addDays(start,14);
  const total=Math.max(diffDays(start,end),1);
  p.steps=tpl.map((tt,i)=>{
    const off=Math.round(total*(i+1)/tpl.length);
    return {id:uid(),title:tt,done:false,due:addDays(start,off)};
  });
}
db.projects.forEach(ensureSteps);
db.projects.forEach(p=>{if(!p.log)p.log=[];if(!p.versions)p.versions=[];});
const projProgress=p=>p.steps.length?Math.round(p.steps.filter(s=>s.done).length/p.steps.length*100):0;

/* 项目版本 · 完成前自动留存，可随时回退；完成后保留最终版 */
function projectVersion(p){
  return {ts:Date.now(),title:p.title,note:p.note||'',steps:(p.steps||[]).map(s=>({id:s.id,title:s.title,done:s.done,due:s.due})),logCount:(p.log||[]).length,prog:projProgress(p)};
}
function projectPushVersion(p){
  if(!p||p.status==='done')return;
  p.versions=p.versions||[];
  const v=projectVersion(p);
  const last=p.versions[p.versions.length-1];
  if(last&&last.title===v.title&&last.note===v.note&&last.prog===v.prog&&last.logCount===v.logCount&&JSON.stringify(last.steps.map(s=>s.done))===JSON.stringify(v.steps.map(s=>s.done)))return;
  p.versions.push(v);
  if(p.versions.length>60)p.versions=p.versions.slice(-60);
}

  };

/* 范文写作技巧分析提示词：让豆包精读范文，深度提炼四要素与可复用技法，再生成模仿写作提示词 */
function writeAnalyzePrompt(f){
  const txt=(f&&f.content||'').trim();
  const ttl=f&&f.title||'（未命名范文）';
  return `你是一名深耕党建教学多年的党校教授与写作方法研究者。请精读以下范文全文，做深度写作技巧分析（识别要准确、分析要深入、概括要到技法层面，不得想当然）：

【范文题目】${ttl}
【范文全文】
${txt.slice(0,8000)}

请输出四部分：
一、结构框架：整体骨架（总分总 / 并列 / 递进等）与段落层次、小标题层级与过渡句写法；
二、开头结尾：开篇如何破题、如何调动读者注意力；结尾如何收束、呼应、升华；
三、语言节奏与句式：长短句搭配、排比设问、口语与书面比例、高频词习惯；
四、修辞与引用习惯：引经据典方式、案例与数据运用。

最后：
五、归纳 3–6 条可复用的核心写作技法（概括到手法层面，不罗列原文）；
六、生成一份「模仿写作提示词」：设定角色（党校教授）、给出仿写任务框架（照搬本范文骨架与节奏），供直接开工仿写同风格成稿。

要求：全部结论必须源于这篇范文本身，不得编造范文之外的内容；输出可直接复制使用。`;
}

  db.trials.forEach(x=>add(x.applyDate,{tag:'讲',title:'试讲 · '+x.course+(x.attempt?' · 第'+x.attempt+'次':'')}));
  db.evals.forEach(e=>add(e.date,{tag:'听',title:'听评课 · '+e.teacher+'《'+e.course+'》'}));
  db.tasks.forEach(k=>add(k.date,{tag:k.kind==='micro'?'微':'宣',title:(k.kind==='micro'?'微课 · ':'宣讲 · ')+k.title}));

  db.writings.forEach(w=>{if(w.status==='active'&&w.deadline)add(w.deadline,{tag:'截',title:w.title+' · 文稿截止'});});
  db.notes.forEach(n=>{if(n.date)add(n.date,{tag:'记',title:(n.cat||autoNoteCat(n.text))+' · '+n.text});});
  const first=new Date(y,m,1);const startDay=first.getDay();
  const dim=new Date(y,m+1,0).getDate();
  const isToday=d=>d===parseISO(t).getDate()&&y===parseISO(t).getFullYear()&&m===parseISO(t).getMonth();
  /* 时段划分：按开始时间 <12 上午 / 12-17 下午 / ≥18 晚；无时间记下午 */
  const slotOf=it=>{
    const st=it.time?String(it.time).split('-')[0].replace(':',''):'';
    if(st&&/^\d{3,4}$/.test(st)){const h=Number(st.slice(0,2));if(h<12)return 'am';if(h>=18)return 'pm2';return 'pm';}

      if(sr)blocks.push(`<span class="cal-slot yellow" style="flex:1">${sr>1?sr+'课 ':''}上饶</span>`);

      return blocks.length?`<div style="display:flex;gap:2px;margin-top:3px">${blocks.join('')}</div>`:`<div class="cal-slot empty"></div>`;
    };
    const otherIts=its.filter(x=>x.tag!=='校'&&x.tag!=='外');
    const tags=otherIts.slice(0,4).map(x=>`<span class="cal-tag">${x.tag}</span>`).join('');
    cells.push(`<td><div class="dnum ${cls} ${sel}" data-action="cal-pick" data-day="${iso}">${d}</div>
      ${slotRow('am')}${slotRow('pm')}${slotRow('pm2')}
      ${tags?`<div class="cal-tags">${tags}</div>`:''}</td>`);
  }
  while(cells.length%7!==0)cells.push('<td></td>');
  let calRows='';

  </div>`).join(''):`<div class="empty" style="padding:16px"><div class="seal-line">闲</div>${sel===t?'今日无安排':'这一天暂无安排'}。授课、试讲、听评课、项目截止、随手记都会实时汇聚到日历里。</div>`;
  $('#content').innerHTML=`
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center">

    </div>
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <div class="card-title"><span class="tick"></span>${y}年${m+1}月 · 授课日历（平铺：上午 / 下午 / 晚 三行一眼可辨）</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm btn-ghost" data-action="cal-prev">${ic('right','ic-sm')} 上月</button>
          <button class="btn btn-sm btn-ghost" data-action="cal-next">下月 ${ic('right','ic-sm')}</button>
        </div>
      </div>
      <table class="cal" style="width:100%"><thead><tr>${['日','一','二','三','四','五','六'].map(w=>`<th>${w}</th>`).join('')}</tr></thead>
      <tbody>${calRows}</tbody></table>
      <div style="margin-top:12px;display:flex;gap:18px;font-size:11.5px;color:var(--brown);flex-wrap:wrap;align-items:center">
        <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(44,116,92,.92);margin-right:4px"></i>南昌本部</span>
        <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(206,172,86,.95);margin-right:4px"></i>上饶分部</span>
        <span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(176,58,46,.9);margin-right:4px"></i>校外（江西 / 福建）</span>

      </div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title"><span class="tick"></span>${fmtCN(sel)} · 当日安排</div>
        <span class="chip wine">课时费 ${fee} 元</span></div>
      ${selHtml}

          <div class="row-sub">点击「导出 ICS」会下载一个日历文件，双击即可导入系统日历；电脑与手机日历里即可看到全部授课、试讲、听评课与项目截止。安排有变动后重新导出一次即保持最新；工作台内本页始终实时更新。</div></div>

  const w=t.words, subW=t.perSub;
  const introW=Math.round(w*0.027), secIntroW=Math.round(w*0.007), secSumW=Math.round(w*0.01), mindW=Math.round(w*0.02), endW=Math.round(w*0.007);
  return `你是一名铁路党校的教授，现在需要为党课《${course||'（课程名称）'}》撰写一份可直接用于课堂的逐字讲稿（${t.v}，约${w}字）。

【资料来源要求】
必须从党的最新会议精神、历次全会精神、各年度最新工作会议文件、历年政府工作报告、人民日报、学习时报、中国纪检监察报、新华社、新华网、央视网、央广网等主流平台的文章资讯中找资料；还需阅读大量铁路相关知识，包括国铁集团的最新指示批示精神、十八个铁路集团公司的贯彻落实部署情况、铁路行业最新动态，以及《人民铁道》报刊、《人民铁道》《南昌铁路》《魅力南铁》等公众号内容。将以上内容有机结合，保证所有内容来源准确、可靠、真实、有渠道可验证。

【写作总要求】
讲稿要逻辑清楚：先说什么、后说什么、怎么说，要有层次、顺序和章法。不需要华丽辞藻的任意堆砌——能够三言两语说清楚的绝不拖泥带水，能够用短小篇幅阐明的道理绝不绕弯子，避免有长度无力度。要按照清晰的逻辑线条串联全文，可运用：递进与主次的逻辑、并列与总分的逻辑、为什么—是什么—怎么样的逻辑、提出问题—分析问题—解决问题的逻辑、过去—现在—未来的逻辑、背景—举措—效果的逻辑。要有思维的严密性、结构的连贯性、论证的透彻性、表达的严谨性，一环扣一环，力求言之有用、言之有据、言之有物。

【两种基本论证方法】
1. 归纳法（从特殊到一般）：先阐明核心观点，用事实材料进行多维论证，归纳得出普遍启示。多用于经验总结，先给观点再给支撑材料，多选用事实材料论证。
2. 演绎法（三段论，从一般到特殊）：大前提（理论依据）→ 小前提（形势与任务分析）→ 结论（政策举措）。多用于阐释理论方针政策，多选用理论论据论证。归纳侧重"论"，演绎侧重"证"。
示例（改革开放议题·演绎法）：大前提：马克思主义唯物史观揭示，生产力决定生产关系，经济基础决定上层建筑；任何国家都必须根据生产力发展要求，适时调整生产关系中不相适应的部分。小前提：我国当前正处于高质量发展阶段，某些领域的体制机制仍存在制约要素自由流动、抑制创新活力的因素，属于生产关系不适应生产力发展的具体表现。结论：因此必须全面深化改革，破除体制机制障碍，进一步解放和发展社会生产力。

【七个量的要求】
①正向能量：传播党的创新理论，坚持正面宣传，传递正向能量。
②知识含量：通过基本事实、知识、常识把道理讲深讲透，给人知识增量。
③信息含量：确保传递的信息准确无误，不能虚假或捏造。
④思想含量：从新视角深化对理论的认识；从生动实践中总结思想养分；着力回应时代命题、把握发展大势。
⑤逻辑力量：逻辑紧密、环环相扣，行云流水、一气呵成，用逻辑的力量将问题说透说清，让人有豁然开朗之感。
⑥文字质量：少一些到处可讲的"套话"，多一些入情入理的真话心里话；少一些正确的"废话"，多一些务实管用的话、自己的话。
⑦眼界气量：地域维度"放眼全球"，时间维度"通古博今"；善于发现事关全局、引领时代的重大理论命题，分析阐述善于运用古今中外的比较研究。

【观点与论据统一】
理论论据：来源于实践并已被长期实践证明和检验的正确理论、观点，包括马克思主义基本原理、革命领袖经典论述、党的创新理论、党的路线方针政策和重要文件等。
事实论据：用来证明论点的事例、史实和数据，可直接获取（来源于实践），也可间接获取（来自文献材料）。
写作中必须坚持材料与观点相统一，选取具备典型性、能够支撑论点、能够反映事物本质和主流的材料，做到支撑有力不片面。

【全文结构（三大部分，遵循为什么—是什么—怎么办 或 理论—历史—实践）】
大标题：《${course||'xxx'}》
引言（约${introW}字）：课程开始先破题，再以问题为导向讲清楚本课程要回答和解决哪些问题（学员关注有困惑但不明白的问题、学员关注且有思考但不透彻的问题、学员关注且有思考但有误解的问题），引出今天课程的三大部分。
导入第一部分（约${secIntroW}字）
一、xxx
（一）xxx（约${subW}字）
（二）xxx（约${subW}字）
（三）xxx（约${subW}字）
小结第一部分并过渡到第二部分（约${secSumW}字）
导入第二部分（约${secIntroW}字）
二、xxx
（一）xxx（约${subW}字）
（二）xxx（约${subW}字）
（三）xxx（约${subW}字）
小结第二部分并过渡到第三部分（约${secSumW}字）
导入第三部分（约${secIntroW}字）
三、xxx
（一）xxx（约${subW}字）
（二）xxx（约${subW}字）
（三）xxx（约${subW}字）
小结第三部分并自然过渡到本课程思维导图总结（约${secSumW}字）
思维导图总结（约${mindW}字）：提炼理论框架或学术框架、学理框架，用一张思维导图总结本课程内容，并回扣开篇引言提出的相关问题。
结语（约${endW}字）：阐明本课程的宏大意义，做出期许或号召，也可以是理论先驱的名言、领导人讲话或古语箴言。
最后表达谦虚和感谢（不计入总字数）。

请先给出三大部分的标题框架和每部分的核心观点，经确认后再逐部分展开撰写全文。`;
}

function buildPPTPrompt(course,typeKey){
  const t=PPT_TYPES.find(x=>x.k===typeKey)||PPT_TYPES[1];
  const body=t.bodyPerSection;
  const isReport=typeKey==='kickoff'||typeKey==='closing';
  const structure=isReport?
    `立项/结项汇报结构：封面1张、目录1张、研究背景与意义若干、研究内容与方法若干、研究成果与创新若干、下一步计划/总结若干、致谢1张，共${t.pages}张。`:
    `页面结构（共${t.pages}张）：封面页1张、问题导入4张（一张图片或讲话吸引注意、三张破题三问）、目录页1张；第一部分：章节页1张+正文页${body}张（导入页1张+中间${body-2}张+小结页1张）；第二部分：章节页1张+正文页${body}张；第三部分：章节页1张+正文页${body}张；全课程思维导图页1张；总结页1张；致谢页1张。`;
  return `你是一名铁路党校的教授，现在需要为党课《${course||'（课程名称）'}》制作一套${t.v}的精品教学课件PPT（共${t.pages}页）。

【总体要求】
提炼文稿的核心要义，严格按照文稿既有逻辑顺序制作（不要想当然望文生义，不要杜撰，遇到谬误要指出并纠偏）。这是用于公开场合精品课比赛分享的高质量PPT。
红白金配色，中国风或极简风，图文并茂，简洁大气，采用公文标准字体排版。PPT字号最小28号，最大48号。

【字号规范】
封面页大标题48号字、目录页44号字、章节页44号字、思维导图28号字、结语40号字、结束页48号字。
正文页每一页都要出现一级标题、二级标题（若有三级标题则也需出现），分别在PPT左上角分层展示，字号由大到小：一级标题36号字、二级标题32号字、三级标题32号字、正文28号字。

【内容与排版】
有数据的部分都用图表显示，有案例的内容可适当使用图片。字数不要太多太密，用关键词关键句（言简意赅，提炼关键信息模块化处理）。按照讲稿本身的行文逻辑来制作PPT（由上至下、由左及右）。
遇到段落文字和引用出处的句子要自动首行缩进两个字符。正文段落文字行距1.5倍（标题行距也1.5倍）。正文页如果内容比较丰富，模块各部分内容不要过于拥挤，文本框不要重叠，布局要爽朗有空气感。
不要自行串改文稿的标题文字。每一张都要有合适的图片或图表（避免图片重复）。如文稿没有三级标题则不用强行杜撰三级标题，忽略即可。

【页面结构】
${structure}

请先给出PPT的完整页面大纲（每页标题+核心要点+配图/图表建议），经确认后再逐页展开详细内容。`;
}

/* ============================================================
   文件导入（范文库 / 好课库 通用）· 单个填入弹窗 · 多个批量建记录
   支持 .txt / .md 直接读；.docx 用原生 ZIP 解析 + DecompressionStream 解压
   ============================================================ */
async function handleImport(input,target){
  const files=input&&input.files?Array.from(input.files):[];
  if(!files.length)return;
  try{
    if(files.length===1){
      const fname=(files[0].name||'').toLowerCase();
      const isImg=/\.(png|jpe?g|webp|gif|bmp)$/i.test(fname);
      if(isImg){

async function readImportText(file){
  const name=(file.name||'').toLowerCase();
  try{
    if(/\.(txt|md)$/.test(name))return await file.text();
    if(/\.docx$/.test(name))return await readDocxText(await file.arrayBuffer());
    if(/\.pptx$/.test(name))return await readPPTXText(await file.arrayBuffer());
    if(/\.doc$/.test(name)){toast('「'+file.name+'」是旧版 .doc 格式，请另存为 .docx 或 .txt 后导入');return null;}
    if(/\.pdf$/.test(name)){toast('「'+file.name+'」为 PDF，请先转成文本或直接粘贴内容');return null;}
    toast('「'+file.name+'」暂不支持，仅支持 .txt / .md / .docx / .pptx（图片请走「收录一门好课」）');return null;
  }catch(e){toast('读取「'+file.name+'」失败：'+e.message);return null;}
}
/* PPTX 文本提取：遍历 ppt/slides/slideN.xml 取 <a:t>（无三方库，ZIP 解析思路同 docx） */
async function readPPTXText(buf){
  const u8=new Uint8Array(buf);const dv=new DataView(buf);
  if(buf.byteLength<22||u8[0]!==0x50||u8[1]!==0x4b)throw new Error('不是有效的 pptx（ZIP）文件');
  let eocd=-1;const min=Math.max(0,buf.byteLength-22-65536);
  for(let i=buf.byteLength-22;i>=min;i--){if(u8[i]===0x50&&u8[i+1]===0x4b&&u8[i+2]===0x05&&u8[i+3]===0x06){eocd=i;break;}}
  if(eocd<0)throw new Error('pptx 结构异常（未找到目录）');
  const cdCount=dv.getUint16(eocd+10,true);const cdOffset=dv.getUint32(eocd+16,true);
  const entries=[];let p=cdOffset;
  for(let n=0;n<cdCount;n++){
    if(p+46>buf.byteLength||u8[p]!==0x50||u8[p+1]!==0x4b||u8[p+2]!==0x01||u8[p+3]!==0x02)break;
    const method=dv.getUint16(p+10,true);const csize=dv.getUint32(p+20,true);const nl=dv.getUint16(p+28,true);const el=dv.getUint16(p+30,true);const cl=dv.getUint16(p+32,true);const lho=dv.getUint32(p+42,true);
    let name='';for(let i=0;i<nl;i++)name+=String.fromCharCode(u8[p+46+i]);
    if(/^ppt\/slides\/slide\d+\.xml$/.test(name)){
      const lNameLen=dv.getUint16(lho+26,true);const lExtraLen=dv.getUint16(lho+28,true);const dataStart=lho+30+lNameLen+lExtraLen;
      entries.push({comp:u8.slice(dataStart,dataStart+csize),method});
    }
    p+=46+nl+el+cl;
  }
  if(!entries.length)throw new Error('pptx 中未找到幻灯片内容');
  let xml='';
  for(const en of entries){
    let x;
    if(en.method===0)x=new TextDecoder('utf-8').decode(en.comp);
    else if(en.method===8){
      if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持 pptx 解压，请用 Chrome');
      const ds=new DecompressionStream('deflate-raw');
      const stream=new Blob([en.comp]).stream().pipeThrough(ds);
      x=new TextDecoder('utf-8').decode(await new Response(stream).arrayBuffer());
    }else continue;
    xml+=x;
  }
  const texts=[];const tRe=/<a:t[^>]*>([\s\S]*?)<\/a:t>/g;let tm;
  while((tm=tRe.exec(xml)))texts.push(tm[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'));
  const txt=texts.join('\n');
  if(!txt)throw new Error('幻灯片中未提取到文字');
  return txt;
}
/* 好课资料自动识别：首行作题目、正则提取授课人、识别「一、/第一章/引言」等作大纲（识别后可再编辑） */
function autoExemplarFields(txt,fname){
  const t=(txt||'').trim();
  const out={title:(fname||'').replace(/\.[^.]+$/,''),teacher:'',outline:''};
  const lines=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length)return out;
  let title=lines[0].replace(/^《|》$/g,'');
  if(title.length>40)title=title.slice(0,40);
  out.title=title||out.title;
  const tm=t.match(/(?:授课人|主讲人|主讲|授课教师|授课老师|主讲教师)[：:\s]*([^\n，,。;；]{1,20})/);
  if(tm)out.teacher=tm[1].replace(/^[：:\s]+/,'').trim();
  const ol=[];
  lines.forEach(l=>{
    if(/^[一二三四五六七八九十]+、/.test(l)||/^(第[一二三四五六七八九十]+[章节讲篇]|第一部分|第二部分|第三部分|引言|导言|前言|结语|总结|结束语|开头|结尾)/.test(l))ol.push(l);
  });
  if(ol.length)out.outline=ol.join('\n');
  return out;
}
async function readDocxText(buf){
  /* 极简 ZIP 解析（无三方库）：EOCD → 中央目录 → word/document.xml → deflate-raw 解压 */
  const u8=new Uint8Array(buf);
  const dv=new DataView(buf);
  if(buf.byteLength<22||u8[0]!==0x50||u8[1]!==0x4b)throw new Error('不是有效的 docx（ZIP）文件');
  let eocd=-1;
  const min=Math.max(0,buf.byteLength-22-65536);
  for(let i=buf.byteLength-22;i>=min;i--){
    if(u8[i]===0x50&&u8[i+1]===0x4b&&u8[i+2]===0x05&&u8[i+3]===0x06){eocd=i;break;}
  }
  if(eocd<0)throw new Error('docx 结构异常（未找到目录）');
  const cdCount=dv.getUint16(eocd+10,true);
  const cdOffset=dv.getUint32(eocd+16,true);
  let entry=null,p=cdOffset;
  for(let n=0;n<cdCount;n++){
    if(p+46>buf.byteLength||u8[p]!==0x50||u8[p+1]!==0x4b||u8[p+2]!==0x01||u8[p+3]!==0x02)break;
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true);
    const el=dv.getUint16(p+30,true);
    const cl=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    let name='';
    for(let i=0;i<nl;i++)name+=String.fromCharCode(u8[p+46+i]);
    if(name==='word/document.xml'){
      const lNameLen=dv.getUint16(lho+26,true);
      const lExtraLen=dv.getUint16(lho+28,true);
      const dataStart=lho+30+lNameLen+lExtraLen;
      entry={comp:u8.slice(dataStart,dataStart+csize),method,csize};
      break;
    }
    p+=46+nl+el+cl;
  }
  if(!entry)throw new Error('docx 中未找到正文（word/document.xml）');
  let xml;
  if(entry.method===0){
    xml=new TextDecoder('utf-8').decode(entry.comp);
  }else if(entry.method===8){
    if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持 docx 解压，请用 Chrome 或转成 .txt');
    const ds=new DecompressionStream('deflate-raw');
    const stream=new Blob([entry.comp]).stream().pipeThrough(ds);
    xml=new TextDecoder('utf-8').decode(await new Response(stream).arrayBuffer());
  }else{
    throw new Error('docx 使用了不支持的压缩方式');
  }
  const paras=[];
  const pRe=/<w:p[ >][\s\S]*?<\/w:p>/g;
  let pm;
  while((pm=pRe.exec(xml))){
    let line='';
    const tRe=/<w:t[^>]*>([\s\S]*?)<\/w:t>/g;
    let tm;
    while((tm=tRe.exec(pm[0])))line+=tm[1];
    line=line.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
    if(line.trim())paras.push(line);
  }
  const txt=paras.join('\n');
  if(!txt)throw new Error('文档中未提取到文字内容');
  return txt;
}

  s+='5. 铁路行业结合：如何把党的创新理论与铁路实际结合？\n';
  s+='6. 语言表达艺术：金句、排比、设问、比喻等修辞运用\n';
  s+='7. 互动与节奏把控：如何调节课堂节奏？有无互动设计？\n';
  s+='8. 结尾升华方式：如何收尾？有无号召、期许、名言？\n';
  s+='9. PPT课件设计：页数分配、图文配合、图表运用\n';
  s+='10. 可直接借鉴的备课方法：列出3-5条最推荐的做法\n\n';
  s+='最后给出一份「备课精华清单」，条目化总结最值得模仿的备课技巧。';
  return s;
}

/* ============================================================
   时间线 · 自动拆解汇聚
   ============================================================ */
function renderTimeline(filter){
  const f=filter||'';
  const items=[];
  db.projects.forEach(p=>{(p.steps||[]).forEach(s=>{if(s.due)items.push({date:s.due,mod:p.module,cls:s.done?'t-done':'',title:esc(p.title)+' · '+esc(s.title),done:s.done})})});
  db.projects.forEach(p=>{if(p.deadline&&p.status==='active')items.push({date:p.deadline,mod:p.module,cls:'t-deadline',title:esc(p.title)+' · 项目截止'})});
  db.school.forEach(c=>items.push({date:c.date,mod:'class',cls:'t-course',title:'在校 · '+esc(c.course)+' · '+esc(c.className)+' · '+fmtClock(c.start)+'–'+fmtClock(c.end)}));
  db.external.forEach(c=>items.push({date:c.date,mod:'class',cls:'t-course',title:'外出 · '+esc(c.course)+' · '+esc(c.org)+' · '+fmtClock(c.start)+'–'+fmtClock(c.end)}));
  db.trials.forEach(x=>{if(x.applyDate)items.push({date:x.applyDate,mod:'trial',cls:x.passed?'t-done':'t-course',title:'试讲 · '+esc(x.course)+' · 第 '+(x.attempt||1)+' 次',done:x.passed})});
  db.tasks.forEach(k=>{if(k.date)items.push({date:k.date,mod:'writing',cls:'t-course',title:(k.kind==='micro'?'微课':'宣讲')+' · '+esc(k.title)})});
  /* 培训/获奖/发文为「荣誉台账」，不混入主时间线，点「荣誉台账」过滤查看 */
  db.trains.forEach(k=>{if(k.dateStart)items.push({date:k.dateStart,mod:'ledger',cls:'t-course',title:'培训 · '+esc(k.name)+(k.location?' @'+esc(k.location):'')+(k.dateEnd?'（'+fmtCN(k.dateStart)+'–'+fmtCN(k.dateEnd)+'）':'')})});
  db.awards.forEach(a=>{if(a.date)items.push({date:a.date,mod:'ledger',cls:'t-done',title:'获奖 · '+esc(a.title)+(a.level?'（'+esc(a.level)+'）':''),done:true})});
  db.publishes.forEach(p=>{if(p.date)items.push({date:p.date,mod:'ledger',cls:'t-done',title:'发文 · '+esc(p.title)+' @'+esc(p.platform||''),done:true})});
  db.evals.forEach(e=>{if(e.date)items.push({date:e.date,mod:'evaluate',cls:'t-course',title:'听评课 · '+esc(e.teacher)+'《'+esc(e.course)+'》'})});
  db.notes.forEach(n=>{if(n.date)items.push({date:n.date,mod:'notes',cls:n.status==='done'?'t-done':'t-course',title:(n.cat||autoNoteCat(n.text))+' · '+esc(n.text),done:n.status==='done',ncat:n.cat||autoNoteCat(n.text)})});
  db.writings.forEach(w=>{if(w.deadline)items.push({date:w.deadline,mod:'writing',cls:'t-deadline',title:esc(w.title)+' · 文稿截止'})});
  const sorted=items.filter(i=>{
    if(f==='ledger')return i.mod==='ledger';
    if(i.mod==='ledger')return false;
    if(!f)return true;
    if(f==='other')return i.mod==='notes'&&['其他工作','日常事务'].includes(i.ncat);
    return i.mod===f;
  }).sort((a,b)=>a.date<b.date?-1:1);
  const t=todayISO();
  let curMonth='';let html='';
  sorted.forEach(it=>{
    const ym=it.date.slice(0,7);
    if(ym!==curMonth){curMonth=ym;const [yy,mm]=ym.split('-');html+=`<div class="tl-month">${yy}年${+mm}月</div>`}
    const late=it.date<t&&!it.done;
    const modName=it.mod==='ledger'?'写作 · 荣誉台账':(MODULES[it.mod]?MODULES[it.mod].name:it.mod);
    html+=`<div class="tl-item ${it.cls}" data-action="tl-go" data-mod="${it.mod}" style="cursor:pointer" title="点此进入「${modName}」继续工作">
      <div class="tl-date">${fmtCN(it.date)} · 星期${wkCN(it.date)}${late?' <span class="wine">已过</span>':''}</div>
      <div class="tl-title">${it.title}</div>
      <div class="tiny muted" style="margin-top:2px">进入${modName} ›</div>
    </div>`;
  });
  $('#content').innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
      <button class="btn ${!f?'btn-primary':'btn-ghost'}" data-action="tl-filter" data-v="">全部</button>
      ${SIX.map(m=>`<button class="btn ${f===m?'btn-primary':'btn-ghost'}" data-action="tl-filter" data-v="${m}">${MODULES[m].name}</button>`).join('')}
      <button class="btn ${f==='other'?'btn-primary':'btn-ghost'}" data-action="tl-filter" data-v="other">其他日常工作</button>
      <button class="btn ${f==='ledger'?'btn-primary':'btn-ghost'}" data-action="tl-filter" data-v="ledger">荣誉台账</button>
    </div>
    <div class="card"><div class="tl">${html||`<div class="empty"><div class="seal-line">序</div>尚无排期。新建项目时，书桌会自动拆解步骤、排出日期，汇聚于此。</div>`}</div></div>`;
}

function renderSearch(q){
  const query=(q||'').trim().toLowerCase();
  const results=[];
  if(query){
    const hit=(mod,title,body,link)=>{if((title+body).toLowerCase().includes(query))results.push({mod,title,body})};
    db.school.forEach(c=>hit('class','在校授课 · '+c.course,`${fmtCN(c.date)} ${fmtClock(c.start)}–${fmtClock(c.end)} · ${schoolVenue(c.venue)} · ${c.className}${c.room?' '+c.room:''}`));
    db.external.forEach(c=>hit('class','外出授课 · '+c.course,`${fmtCN(c.date)} ${fmtClock(c.start)}–${fmtClock(c.end)} · ${c.org} ${c.className} · ${c.location} · ${c.sessions}场`));
    db.trials.forEach(x=>hit('trial','试讲 · '+x.course,`第 ${x.attempt||1} 次 · ${x.passed?'已通过':'进行中'}${x.note?' '+x.note:''}`));
    db.notes.forEach(n=>hit('notes','随手记 · '+n.text,`${n.date?fmtCN(n.date)+' ':''}${n.time?n.time+' ':''}归入 ${n.cat||autoNoteCat(n.text)}${n.status==='done'?' · 已完成':''}`));
    db.tasks.forEach(k=>hit('writing',(k.kind==='micro'?'微课':'宣讲')+' · '+k.title,`${k.kind==='micro'?'奖金单 '+k.fee+' 元':(k.sessions||1)+' 场 × 200 元'}${k.note?' '+k.note:''}`));
    db.trains.forEach(k=>hit('writing','培训 · '+k.name,`${k.location?'地点 '+k.location+' ':''}${k.dateStart?(fmtCN(k.dateStart)+(k.dateEnd?'–'+fmtCN(k.dateEnd):'')):''}${k.hours?' '+k.hours+' 课时':''}${k.courses?' · '+k.courses:''}`));
    db.awards.forEach(a=>hit('writing','获奖 · '+a.title,`${a.date?fmtCN(a.date)+' ':''}${a.level?'级别 '+a.level+' ':''}${a.content||''}`));
    db.publishes.forEach(p=>hit('writing','发文 · '+p.title,`${p.date?fmtCN(p.date)+' ':''}${p.platform?'@'+p.platform+' ':''}${p.level?p.level+' ':''}${p.cn?'CN '+p.cn+' ':''}${p.issn?'ISSN '+p.issn:''}`));
    db.courseLib.forEach(c=>hit('class','专题课程库 · '+c,c));
    db.projects.forEach(p=>hit(p.module,'项目 · '+p.title,`${MODULES[p.module].name} · ${p.st} · ${p.note||''}`));
    db.evals.forEach(e=>hit('evaluate','听评课 · '+e.course,`${fmtCN(e.date)} ${e.teacher} · ${(e.suggestions||[]).join(' / ')}`));
    db.ideas.forEach(i=>hit('ideas','灵感 · '+(i.cat||autoCat(i.text)),i.text));
    db.writings.forEach(w=>hit('writing','文稿 · '+w.title,(w.content||'').slice(0,200)));
    db.materials.forEach(m=>hit('writing','素材 · '+m.title,`${m.source} · ${m.kind||''} ${m.note||''}`));
    db.sources.forEach(s=>hit('writing','素材来源 · '+s.name,s.kind));
  }
  const byMod={};results.forEach(r=>{(byMod[r.mod]=byMod[r.mod]||[]).push(r)});
  const modOrder=SIX.concat(['ideas']);
  const mods=Object.keys(byMod).sort((a,b)=>modOrder.indexOf(a)-modOrder.indexOf(b));
  $('#content').innerHTML=`
    <div class="searchbox">
      ${ic('search')}
      <input id="searchInput" type="text" placeholder="检索全部：课程、项目、步骤、灵感、文稿、素材……" value="${esc(query)}" autofocus>
      <button class="btn-ghost btn btn-sm" data-action="clear-search">清空</button>

/* ============================================================
   主渲染
   ============================================================ */
function render(){
  renderNav();topbar();
  const r=currentRoute();
  const q=(location.hash.split('?')[1]||'');
  const params=new URLSearchParams(q);
  document.getElementById('app').classList.remove('rail-open');
  switch(r){
    case 'today':renderToday();break;
    case 'prep':renderProjects('prep');break;
    case 'research':renderProjects('research');break;
    case 'trial':renderTrials();break;
    case 'class':renderClass();break;
    case 'evaluate':renderEval();break;
    case 'writing':renderWriting(params.get('tab'));break;
    case 'ideas':renderIdeas();break;
    case 'notes':renderNotes();break;
    case 'exemplars':renderExemplars();break;
    case 'timeline':renderTimeline(params.get('f'));break;
    case 'search':renderSearch(params.get('q'));break;
    case 'calendar':renderCalendar();break;
  }
  window.scrollTo({top:0});
}
window.addEventListener('DOMContentLoaded',render);
/* 打开页面立即从云端拉取最新数据（拉取完成前禁止推送，防止种子数据覆盖） */
window.addEventListener('DOMContentLoaded',()=>{giteePull(r=>{if(r.ok&&r.restored){render();toast(r.msg);}});});

/* ============================================================
   弹窗
   ============================================================ */
function openModal(title,body){
  $('#modalTitle').textContent=title;
  $('#modalBody').innerHTML=body;
  $('#modal').classList.remove('hidden');
}
function closeModal(){$('#modal').classList.add('hidden')}

let toastTimer=null;
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

function fld(label,inner){return `<div class="fld"><label>${label}</label>${inner}</div>`}

function courseLibOpts(sel){
  return `<datalist id="courseLibList">${(db.courseLib||[]).map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist>`;
}
/* 课程名称字段：下拉从专题课库选择，另设「其他课程」自由填写（避免 datalist 在部分环境不稳定） */
function courseField(val){
  const lib=db.courseLib||[];
  const opts=lib.map(c=>`<option value="${esc(c)}" ${val===c?'selected':''}>${esc(c)}</option>`).join('');
  const isCustom=val&&!lib.includes(val);
  return `<select name="course" class="course-sel" required>
      <option value="">— 从专题课库选择 —</option>${opts}
      <option value="__custom__" ${isCustom?'selected':''}>＋ 其他课程（在下方填写）</option>
    </select>
    <input type="text" name="courseCustom" placeholder="填写课程名称" value="${esc(isCustom?val:'')}" style="margin-top:6px;${isCustom?'':'display:none'}" ${isCustom?'required':''}>`;
}
function courseSelChange(sel){
  const v=sel.value;
  const box=sel.parentElement.querySelector('[name="courseCustom"]');
  if(box){
    const custom=v==='__custom__';
    box.style.display=custom?'':'none';
    box.required=custom;
    if(custom)box.focus();
  }
}
function pickedCourse(form){
  const sel=form.querySelector('[name="course"]');
  if(!sel)return form.querySelector('[name="course"]')?.value.trim()||'';
  if(sel.value==='__custom__')return form.querySelector('[name="courseCustom"]')?.value.trim()||'';
  return sel.value.trim();
}

function trialForm(x){
  x=x||{};
  const type=trialTypeGuess(x);
  const t=TRIAL_TYPES.find(z=>z.v===type)||TRIAL_TYPES[2];
  const typeOpts=TRIAL_TYPES.map(z=>`<option value="${z.v}" ${type===z.v?'selected':''}>${z.label}（${z.desc}）</option>`).join('');
  const withOrg=x.withOrg||false;
  const showOrg=type==='mooc'&&(Number(x.attempt)||1)>=2;
  return `<form data-form="trial">
    <div class="fld-row">
      ${fld('申请时间',`<input type="date" name="applyDate" value="${x.applyDate||todayISO()}">`)}
      ${fld('试讲分类',`<select name="type" data-fee-recalc>${typeOpts}</select>`)}
    </div>
    <div class="fld-row">
      ${fld('第几次试讲',`<input type="number" name="attempt" min="1" max="${t.rounds}" value="${x.attempt||1}" data-fee-recalc>`)}
      ${fld('是否已通过',`<select name="passed" data-fee-recalc><option value="0" ${!x.passed?'selected':''}>未通过 / 待通过</option><option value="1" ${x.passed?'selected':''}>已通过</option></select>`)}
    </div>
    ${fld('课程题目（从专题课库选择）',courseField(x.course||''))}
    <div id="trialOrgBox" class="fld" style="display:flex;gap:10px;align-items:center;background:var(--ivory);border:1px solid var(--line);border-radius:6px;padding:10px 12px;${showOrg?'':'display:none'}" data-org="mooc">
      <input type="checkbox" name="withOrg" id="tw" ${withOrg?'checked':''} style="width:16px;height:16px">
      <label for="tw" style="font-size:13px;color:var(--brown);margin:0">慕课第 2 次试讲与机关联合试讲（通过后另加 200 元）</label>
    </div>
    <div class="fld" style="display:flex;gap:10px;align-items:center;background:var(--ivory);border:1px solid var(--line);border-radius:6px;padding:10px 12px">
      <input type="checkbox" name="isNew" id="tn" ${x.isNew?'checked':''} style="width:16px;height:16px">
      <label for="tn" style="font-size:13px;color:var(--brown);margin:0">新课程（按微课 / 慕课 / 大课规则自动计费）</label>
    </div>
    <div id="trialRuleTip" class="tiny muted" style="margin:2px 0 10px">${t.desc}${type==='mooc'?'（与机关联合试讲另 +200）':''}；未通过不计费。</div>
    ${fld('通过课时费（按规则自动计算）',`<div class="tiny wine" style="font-family:var(--serif);font-weight:700;font-size:16px" id="trialFeePreview">¥${trialFee(type,Number(x.attempt)||1,!!x.passed,withOrg)}</div>`)}
    ${fld('通过日期',`<input type="date" name="passDate" value="${x.passDate||''}">`)}
    ${fld('备注',`<input type="text" name="note" value="${esc(x.note||'')}" placeholder="如：科级以上班通过">`)}
    ${!x.id?`<div style="margin-bottom:12px"><label style="display:block;font-size:12px;color:var(--brown);letter-spacing:.1em;margin-bottom:8px">三步流程 · 本次申请已完成项（逐项勾选确认，每次新建都会提醒）</label>
      ${TRIAL_STEPS.map((s,i)=>`<div class="suggest-field"><span class="num">${i+1}</span><label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer"><input type="checkbox" name="step_${i}" style="width:15px;height:15px"><span style="font-size:13px;color:var(--brown)">${s}</span></label></div>`).join('')}
    </div>`:`<div class="tiny muted" style="margin-top:4px">三步流程可在记录页直接勾选推进。</div>`}
    <div class="form-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">取消</button><button class="btn btn-primary">${x.id?'保存修改':'新建试讲申请'}</button></div>
  </form>`;
}

function taskForm(k){

  return `<form data-form="task">
    <div class="fld-row">
      ${fld('工作类型',`<select name="kind" data-fee-recalc>
        <option value="micro" ${kind==='micro'?'selected':''}>录制微课</option>
        <option value="preach" ${kind==='preach'?'selected':''}>宣讲</option>
      </select>`)}
      ${fld('日期',`<input type="date" name="date" value="${k.date||todayISO()}">`)}
    </div>
    ${fld('标题 / 主题',`<input type="text" name="title" required value="${esc(k.title||'')}" placeholder="${kind==='micro'?'如：《铁路职业道德》微课 · 第2讲':'如：学习贯彻党的二十届三中全会精神宣讲'}">`)}
    <div id="taskExtFields" class="fld-row" style="${kind==='preach'?'':'display:none'}">
      ${fld('宣讲场次（每场 200 元）',`<input type="number" name="sessions" min="1" value="${k.sessions||1}" data-fee-recalc>`)}
      ${fld('宣讲人次',`<input type="number" name="headcount" min="0" value="${k.headcount||''}">`)}
    </div>
    <div id="taskPreachFields" style="${kind==='preach'?'':'display:none'};margin-bottom:12px">
      <div class="fld-row">
        ${fld('出差开始日期',`<input type="date" name="dateStart" value="${k.dateStart||k.date||''}">`)}
        ${fld('出差结束日期',`<input type="date" name="dateEnd" value="${k.dateEnd||''}">`)}

      ${fld('途经机场（手动填写，如：南昌昌北 → 福州长乐）',`<input type="text" name="airports" value="${esc(k.airports||'')}" placeholder="各段机场，顿号或箭头分隔">`)}
      ${fld('到访站区（手动填写，如：南昌站区、福州站区、厦门站区）',`<input type="text" name="stations" value="${esc(k.stations||'')}" placeholder="宣讲到过的铁路站区">`)}
    </div>
    ${fld('课时费 / 奖金（自动计算）',`<div class="tiny wine" style="font-family:var(--serif);font-weight:700;font-size:16px" id="taskFeePreview">${kind==='micro'?'¥300':'¥'+(k.sessions||1)*200}</div>`)}
    ${fld('附注',`<input type="text" name="note" value="${esc(k.note||'')}">`)}
    <div class="tiny muted" style="margin-top:4px">保存后将按工作类型自动生成步骤清单，可逐项勾选推进：微课为「准备讲稿→确定拍摄时间场地方式→剪辑视频审核→顺利发布→登记完成」；宣讲含出差申请、通知、发票与报销等流程。</div>
    <div class="form-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">取消</button><button class="btn btn-primary">${k.id?'保存修改':'新建工作安排'}</button></div>
  </form>`;
}

/* ============================================================
   全局事件 · 委托
   ============================================================ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  const id=id=>t.getAttribute('data-id');
  const act=t&&t.getAttribute('data-action');
  if(!act)return;
  switch(act){
    case 'close-modal':closeModal();break;
    case 'quick-new':{
      const r=currentRoute();
      if(r==='today')openModal('新建',`
        <div style="display:grid;gap:10px">
          ${[['q-school','在校授课'],['q-external','外出授课'],['q-note','随手记'],['q-project','新建项目'],['q-idea','记灵感'],['q-eval','听评课记录'],['q-trial','试讲申请'],['q-task','微课 / 宣讲']].map(([a,l])=>`<button class="btn btn-soft block" data-action="${a}">${l}</button>`).join('')}
        </div>`);
      else if(r==='prep'||r==='research')openModal('新建项目',projectForm(r));
      else if(r==='class'){clsView.tab='school';openModal('记在校授课',schoolForm());}
      else if(r==='trial')openModal('新建说课试讲申请',trialForm());
      else if(r==='evaluate')openModal('新建听评课记录',evalForm());
      else if(r==='writing'){const tab=(location.hash.split('?')[1]||'');openModal(tab.includes('task')?'新建微课 / 宣讲':tab.includes('mat')?'收一条素材':'新建文稿',tab.includes('task')?taskForm():tab.includes('mat')?materialForm():writingForm());}
      else if(r==='ideas')openModal('记一条灵感',ideaForm());
      else if(r==='timeline')toast('时间线由各项目的自动拆解步骤与课程汇聚而成');
      else if(r==='calendar')toast('全案日历实时汇总；点上方按钮可记授课');
      else if(r==='search')$('#searchInput').focus();
      break;
    }
    case 'q-school':clsView.tab='school';openModal('记在校授课',schoolForm());break;
    case 'q-external':clsView.tab='ext';openModal('记外出授课',externalForm());break;
    case 'q-trial':openModal('新建说课试讲申请',trialForm());break;
    case 'q-task':openModal('新建微课 / 宣讲',taskForm());break;
    case 'q-train':openModal('记培训',trainForm());break;
    case 'q-award':openModal('记获奖',awardForm());break;
    case 'q-publish':openModal('记发文',publishForm());break;
    case 'edit-train':{const k=db.trains.find(x=>x.id===id());if(k)openModal('编辑培训',trainForm(k));break}
    case 'del-train':{const k=db.trains.find(x=>x.id===id());if(k&&confirm('删除培训记录「'+k.name+'」？')){db.trains=db.trains.filter(x=>x.id!==k.id);save();render();toast('培训记录已删除');}break}
    case 'edit-award':{const k=db.awards.find(x=>x.id===id());if(k)openModal('编辑获奖',awardForm(k));break}
    case 'del-award':{const k=db.awards.find(x=>x.id===id());if(k&&confirm('删除获奖记录「'+k.title+'」？')){db.awards=db.awards.filter(x=>x.id!==k.id);save();render();toast('获奖记录已删除');}break}
    case 'edit-publish':{const k=db.publishes.find(x=>x.id===id());if(k)openModal('编辑发文',publishForm(k));break}
    case 'del-publish':{const k=db.publishes.find(x=>x.id===id());if(k&&confirm('删除发文记录「'+k.title+'」？')){db.publishes=db.publishes.filter(x=>x.id!==k.id);save();render();toast('发文记录已删除');}break}
    case 'task-filter':{taskView.f=t.getAttribute('data-v')||'';render();break}
    case 'q-course-lib':openModal('加一门专题课',courseLibForm());break;
    case 'q-project':openModal('新建项目',projectForm(currentRoute()==='prep'?'prep':currentRoute()==='research'?'research':'prep'));break;
    case 'q-idea':openModal('记一条灵感',ideaForm());break;
    case 'q-final':openModal('存入定稿库',finalForm());break;
    case 'edit-final':{const f=db.finals.find(x=>x.id===id());if(f)openModal('编辑定稿',finalForm(f));break}
    case 'final-view':{const f=db.finals.find(x=>x.id===id());if(f)openModal('定稿 · '+esc(f.course||'')+' · '+esc(f.kind||''),`<div class="tiny muted" style="margin-bottom:8px">${esc(f.version||'')}${f.note?' · '+esc(f.note):''} · 存于 ${fmtCN(f.created||'')}</div><div style="max-height:60vh;overflow:auto;white-space:pre-wrap;line-height:1.8;font-size:13.5px;padding:12px;background:var(--ivory);border-radius:6px">${esc(f.content||'')}</div><div class="form-actions"><button class="btn btn-ghost" data-action="close-modal">关闭</button><button class="btn" data-action="edit-final" data-id="${f.id}">编辑定稿</button></div>`);break}
    case 'del-final':{const f=db.finals.find(x=>x.id===id());if(f&&confirm('删除这份定稿「'+f.course+' · '+f.kind+'」？')){db.finals=db.finals.filter(x=>x.id!==f.id);save();render();toast('定稿已删除');}break}
    case 'fanwen-analyze':{
      const f=db.fanwen.find(x=>x.id===id());
      if(!f||!f.content){toast('范文正文为空，无法分析');break;}
      promptModal(`范文《${esc(f.title)}》写作技巧分析：提示词会让豆包精读全文，深度提炼结构框架、开头结尾、语言节奏、修辞引用四要素与可复用技法，并生成模仿写作提示词；分析结果可复制回范文「写作技巧分析」框留存。`,`${writeAnalyzePrompt(f)}`,`写作技巧分析-${(f.title||'范文').slice(0,20)}.txt`);
      break}
    case 'idea-prompt':{
      const cat=t.getAttribute('data-cat')||'';
      const p=ideaPrompt(cat);
      if(!p){toast('该类别还没有灵感');break;}
      promptModal(`灵感库「${esc(cat)}」共 ${db.ideas.filter(i=>(i.cat||autoCat(i.text))===cat).length} 条——提示词将这批灵感提炼为可借鉴到豆包模仿成稿的技法。`,`${p}`,`灵感提示词-${cat}.txt`);
      break}
    case 'q-note':openModal('随手记工作安排',noteForm());break;
    case 'q-eval':openModal('新建听评课记录',evalForm());break;
    case 'q-material':openModal('收一条素材',materialForm());break;
    case 'q-writing':openModal('新建文稿',writingForm());break;
    case 'q-source':openModal('添入来源库',sourceForm());break;
    case 'q-timeline':go('timeline');break;
    case 'new-project':openModal('新建项目 · 自动拆进度',projectForm(t.getAttribute('data-module')));break;
    case 'edit-project':{const p=db.projects.find(x=>x.id===id());if(p)openModal('编辑项目',projectForm(p.module,p));break}

/* 表单提交 */
document.addEventListener('submit',e=>{
  const form=e.target.closest('form[data-form]');
  if(!form)return;
  e.preventDefault();
  const f=form.getAttribute('data-form');
  const v=n=>form.querySelector('[name="'+n+'"]')?.value.trim();
  switch(f){
    case 'school':{
      const start=v('start'),end=v('end');
      if(start&&end&&start>=end){toast('结束时间需晚于开始时间');return;}
      const venue=v('venue');
      const obj={id:uid(),date:v('date'),start,end,venue,className:v('className'),room:v('room'),course:pickedCourse(form)||v('course'),level:v('level')||'n',firstSenior:form.querySelector('[name="firstSenior"]')?.checked||false,headcount:Number(v('headcount'))||0,fee:schoolFee(venue,v('level')||'n',form.querySelector('[name="firstSenior"]')?.checked||false),note:v('note'),done:false};
      if(form.dataset.editing){const c=db.school.find(x=>x.id===form.dataset.editing);if(c)Object.assign(c,obj);}
      else db.school.push(obj);
      save();closeModal();render();toast('在校授课已记入课表 · 课时费 ¥'+obj.fee);
      break}
    case 'external':{
      const start=v('start'),end=v('end');
      if(start&&end&&start>=end){toast('结束时间需晚于开始时间');return;}
      const sessions=Number(v('sessions'))||1;
      const feePlan=v('feePlan')||'2-400';
      const hours=v('hours')!==''&&v('hours')!=null?Number(v('hours')):extPlanHours(feePlan,2);
      const obj={id:uid(),date:v('date'),start,end,org:v('org'),className:v('className'),location:v('location'),sessions,hours,course:pickedCourse(form)||v('course'),headcount:Number(v('headcount'))||0,fee:sessions*extUnitFee(feePlan),feePlan,note:v('note'),done:false};
      if(form.dataset.editing){const c=db.external.find(x=>x.id===form.dataset.editing);if(c)Object.assign(c,obj);}
      else db.external.push(obj);
      save();closeModal();render();toast('外出授课已记入 · '+sessions+' 场 · 总学时 '+hours+' · 课时费 ¥'+obj.fee);
      break}
    case 'course-lib':{
      const n=v('name');
      if(db.courseLib.includes(n)){toast('该课程已在库中');return;}
      db.courseLib.push(n);save();closeModal();render();toast('已加入专题课程库');
      break}
    case 'trial':{
      const prev=form.dataset.editing?db.trials.find(y=>y.id===form.dataset.editing):null;
      const steps=prev&&prev.steps&&prev.steps.length?prev.steps:TRIAL_STEPS.map((s,i)=>({id:uid(),title:s,done:form.querySelector('[name="step_'+i+'"]')?.checked||false}));
      const type=v('type')||trialTypeGuess(prev||{});
      const attempt=Number(v('attempt'))||1;
      const passed=v('passed')==='1';
      const withOrg=!!(form.querySelector('[name="withOrg"]')||{}).checked;
      const obj={id:uid(),applyDate:v('applyDate'),type,attempt,course:pickedCourse(form)||v('course'),isNew:form.querySelector('[name="isNew"]')?.checked||false,steps,passed,fee:trialFee(type,attempt,passed,withOrg),withOrg,passDate:v('passDate')||'',note:v('note')};
      if(form.dataset.editing){const x=db.trials.find(y=>y.id===form.dataset.editing);if(x)Object.assign(x,obj);}
      else db.trials.push(obj);
      const doneN=steps.filter(s=>s.done).length;
      save();closeModal();render();toast('试讲申请已登记 · '+(obj.fee>0?('通过计费 ¥'+obj.fee):'当前不计费')+(doneN?' · 流程完成 '+doneN+'/'+steps.length:''));
      break}
    case 'task':{
      const kind=v('kind');
      const sessions=Number(v('sessions'))||1;
      const steps=(kind==='micro'?MICRO_STEPS:PREACH_STEPS).map(s=>({id:uid(),title:s,done:false}));
      const obj={id:uid(),kind,title:v('title'),date:v('date'),dateStart:v('dateStart')||v('date'),dateEnd:v('dateEnd')||'',airports:v('airports')||'',stations:v('stations')||'',sessions,headcount:Number(v('headcount'))||0,steps,status:'active',fee:kind==='micro'?300:sessions*200,note:v('note')};
      if(form.dataset.editing){const k=db.tasks.find(y=>y.id===form.dataset.editing);if(k)Object.assign(k,obj);}
      else db.tasks.push(obj);
      save();closeModal();render();toast(kind==='micro'?'微课安排已登记（准备讲稿→拍摄→剪辑→发布→登记）':'宣讲安排已登记 · 每场 200 元');
      break}
    case 'train':{
      const k=db.trains.find(x=>x.id===form.dataset.editing)||{};
      const obj={id:k.id||uid(),name:v('name'),location:v('location'),dateStart:v('dateStart')||'',dateEnd:v('dateEnd')||'',hours:v('hours')||'',courses:v('courses')||'',note:v('note'),created:k.created||todayISO()};
      if(k.id){Object.assign(k,obj)}else{db.trains.push(obj)}
      save();closeModal();render();toast(k.id?'培训记录已更新':'培训已登记');
      break}
    case 'award':{
      const k=db.awards.find(x=>x.id===form.dataset.editing)||{};
      const obj={id:k.id||uid(),title:v('title'),date:v('date')||'',level:v('level')||'',content:v('content')||'',note:v('note'),created:k.created||todayISO()};
      if(k.id){Object.assign(k,obj)}else{db.awards.push(obj)}
      save();closeModal();render();toast(k.id?'获奖记录已更新':'获奖已登记');
      break}
    case 'publish':{
      const k=db.publishes.find(x=>x.id===form.dataset.editing)||{};
      const obj={id:k.id||uid(),title:v('title'),date:v('date')||'',platform:v('platform')||'',level:v('level')||'',cn:v('cn')||'',issn:v('issn')||'',note:v('note'),created:k.created||todayISO()};
      if(k.id){Object.assign(k,obj)}else{db.publishes.push(obj)}
      save();closeModal();render();toast(k.id?'发文记录已更新':'发文已登记');
      break}
    case 'note':{
      const text=v('text');
      if(!text)return;
      const cat=autoNoteCat(text);
      const date=parseNoteDate(text);
      const time=parseNoteTime(text);
      const n={id:uid(),text,date,time,cat,status:'pending',created:todayISO()};
      db.notes.push(n);
      save();closeModal();render();
      toast('已记入随手记 · 归入「'+cat+'」'+(date?' · '+fmtCN(date):''));
      break}
    case 'project':{
      const module=form.getAttribute('data-module')||(currentRoute()==='research'?'research':currentRoute()==='writing'?'writing':'prep');
      const sub=v('sub');
      const existing=form.dataset.editing?db.projects.find(x=>x.id===form.dataset.editing):null;
      if(existing){
        existing.sub=sub;existing.st=(SUBTYPES[existing.module]||[]).find(s=>s.k===sub)?.v||'';
        existing.title=v('title');existing.status=v('status')||'active';existing.deadline=v('deadline')||null;existing.note=v('note');
        if(existing.status==='active')existing.versions=existing.versions||[];
        ensureSteps(existing);projectPushVersion(existing);
        save();closeModal();render();toast('项目已更新并留存版本');
      }else{
        const p={id:uid(),module,sub,st:(SUBTYPES[module]||[]).find(s=>s.k===sub)?.v||'',title:v('title'),status:v('status')||'active',deadline:v('deadline')||null,steps:[],log:[],versions:[],note:v('note'),created:todayISO()};
        ensureSteps(p);projectPushVersion(p);db.projects.push(p);
        // 备课卷：讲稿与课件配套联动 —— 新建其一，自动在另一类新建配套任务
        if(module==='prep'&&(sub==='lecture'||sub==='ppt')){
          const pairSub=sub==='lecture'?'ppt':'lecture';
          const pairSt=pairSub==='ppt'?'党课课件':'党课讲稿';
          const already=db.projects.find(x=>x.module==='prep'&&x.sub===pairSub&&x.title===p.title&&x.status!=='done');
          if(!already){
            const pp={id:uid(),module:'prep',sub:pairSub,st:pairSt,title:p.title,status:'active',deadline:p.deadline,steps:[],log:[],versions:[],note:(p.note?p.note+'；':'')+'与「'+p.st+'」配套，自动创建',created:todayISO(),pairId:p.id};
            ensureSteps(pp);projectPushVersion(pp);db.projects.push(pp);
            p.pairId=pp.id;
            save();closeModal();render();
            toast('已拆解 '+p.steps.length+' 步，并自动在「'+pairSt+'」新建配套任务（讲稿课件配套联动）');
            break;
          }else{
            p.pairId=already.id;
            already.pairId=p.id;
            save();closeModal();render();
            toast('已与已有「'+pairSt+'」任务自动关联（讲稿课件配套联动）');
            break;
          }
        }
        save();closeModal();render();
        toast('已拆解为 '+p.steps.length+' 个步骤，并排入时间线');
      }
      break}
    case 'project-log':{
      const pid=form.getAttribute('data-pid');
      const p=db.projects.find(x=>x.id===pid);
      const text=v('text');
      if(!p||p.status==='done')return;
      if(!text){toast('先写一段工作内容再记入');return;}
      p.log=p.log||[];p.log.push({id:uid(),ts:Date.now(),text});
      projectPushVersion(p);save();closeModal();render();
      toast('已记入工作记录并留存版本');
      break}
    case 'final':{
      const fl=db.finals.find(x=>x.id===form.dataset.editing)||{};
      const obj={id:fl.id||uid(),course:pickedCourse(form)||v('course'),kind:v('kind')||'讲稿文字定稿',version:v('version')||'',content:v('content')||'',note:v('note')||'',created:fl.created||todayISO()};
      if(fl.id){Object.assign(fl,obj)}else{db.finals.push(obj)}
      save();closeModal();render();toast(fl.id?'定稿已更新':'已存入定稿库');
      break}
    case 'idea':{
      const text=v('text');
      db.ideas.push({id:uid(),ts:Date.now(),text,cat:v('cat')||'',course:v('course')||'',guide:form.querySelector('[name="guide"]')?.checked||false,source:''});
      save();closeModal();render();
      toast('灵感已收入 · 自动归入「'+(v('cat')||autoCat(text))+'」'+(form.querySelector('[name="guide"]')?.checked?' · 已标记备课指导':''));
      break}
    case 'eval':{
      const sug=[0,1,2].map(i=>v('sug_'+i)).filter(Boolean);
      const errors=v('errors')?v('errors').split(/[，,、;；]/).map(s=>s.trim()).filter(Boolean):[];
      if(sug.length<3){toast('建议补足三条，才够同行拿去落地修改');return;}
      const steps=EVAL_STEPS.map((s,i)=>({id:uid(),title:s.title,done:form.querySelector('[name="estep_'+i+'"]')?.checked||false}));
      const obj={id:uid(),date:v('date'),teacher:v('teacher'),type:v('type')||'mooc',fee:v('fee')||'20',course:v('course'),outline:v('outline'),suggestions:sug,errors,steps,note:v('note')};
      if(form.dataset.editing){const ev=db.evals.find(x=>x.id===form.dataset.editing);if(ev)Object.assign(ev,obj);}
      else db.evals.push(obj);
      const doneN=steps.filter(s=>s.done).length;
      save();closeModal();render();toast('听评课记录已存 · 流程完成 '+doneN+'/'+steps.length+' · 听课费 '+obj.fee+' 元');
      break}
    case 'writing':{
      const w=db.writings.find(x=>x.id===form.dataset.editing)||{};
      const obj={id:w.id||uid(),type:v('type'),title:v('title'),deadline:v('deadline')||null,status:w.status||'active',content:v('content')||'',updated:todayISO()};
      if(w.id){Object.assign(w,obj)}else{db.writings.push(obj)}
      save();closeModal();render();toast(w.id?'文稿已保存':'文稿已新建');
      break}
    case 'material':{
      const date=v('date')||todayISO();
      const todayCount=db.materials.filter(m=>m.date===date).length;
      if(todayCount>=10){toast('该日素材已达 10 条上限');return;}
      db.materials.push({id:uid(),date,source:v('source'),title:v('title'),url:v('url'),kind:v('kind'),note:v('note')});
      save();closeModal();render();toast('素材已收入 · 今日 '+ (db.materials.filter(m=>m.date===date).length) +'/10');
      break}
    case 'source':{
      const n=v('name');
      if(db.sources.some(s=>s.name===n)){toast('该来源已在库中');return;}
      db.sources.push({name:n,kind:v('kind')});save();closeModal();render();toast('来源已添入');
      break}
    case 'fanwen':{
      const fw=db.fanwen.find(x=>x.id===form.dataset.editing)||{};
      const obj={id:fw.id||uid(),title:v('title'),wtype:v('wtype')||'其他',note:v('note'),content:v('content'),analysis:v('analysis')||'',created:fw.created||todayISO()};
      if(fw.id){Object.assign(fw,obj)}else{db.fanwen.push(obj)}
      save();closeModal();render();toast(fw.id?'范文已保存':'范文已收录 · 归入「'+(obj.wtype||'其他')+'」');
      break}
    case 'imit':{
      const im=db.imits.find(x=>x.id===form.dataset.editing)||{};
      const obj={id:im.id||uid(),title:v('title'),theme:v('theme'),fanwenId:v('fanwenId')||null,occasion:v('occasion'),audience:v('audience'),duration:v('duration')?Number(v('duration')):null,words:v('words')?Number(v('words')):null,needPPT:!!(form.querySelector('[name="needPPT"]')||{}).checked,created:im.created||todayISO()};

  }
